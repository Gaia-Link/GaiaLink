[project]
name = "gaia-link-agent"
version = "1.0.0"
description = "Gaia Link SpoonOS AI Agent - 人道救援協作網絡"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gaia Link Team"}
]
keywords = ["spoonos", "ai-agent", "humanitarian", "web3"]

dependencies = [
    "spoon-ai-sdk>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]
blockchain = [
    "web3>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaia_link"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["gaia_link"]
branch = true
omit = [
    "gaia_link/schemas.py",  # Pydantic 模型定義，不需要測試
    "gaia_link/services/sepolia_blockchain.py",  # 需要 web3，整合測試時另行測試
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]
